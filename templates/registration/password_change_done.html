{% extends 'base.html' %}
{% block title %}Password Changed{% endblock %}
{% block breadcrumb %}
<div class="breadcrumb-trail"><a href="{% url 'dashboard' %}">No-Dues &amp; TC</a> <span>/</span> <span class="current">Change Password</span></div>
{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Password Changed</h1>
  </div>
</div>

<div class="lr-card p-4" style="max-width: 480px;">
  <p class="mb-3"><i class="bi bi-check-circle-fill" style="color:var(--success);"></i> Your password was changed successfully.</p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
