{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · No-Dues &amp; TC</title>
<link href="{% static 'assets/css/inter-font.css' %}" rel="stylesheet">
<link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet">
<link href="{% static 'assets/css/bootstrap-icons.css' %}" rel="stylesheet">
<link href="{% static 'assets/css/theme.css' %}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark"><i class="bi bi-mortarboard-fill"></i></div>
    <div>
      <div class="brand-title">No-Dues &amp; TC</div>
      <div class="brand-subtitle">Certificate Desk</div>
    </div>
  </div>

  {% if form.errors %}
    <div class="alert alert-danger py-2 small">Incorrect username or password.</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label small fw-semibold">Username</label>
      <input type="text" name="username" class="form-control" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold py-2">Sign In</button>
  </form>
  <p class="text-center text-muted small mt-3 mb-0">No-Dues &amp; Transfer Certificate Management</p>
</div>

<script src="{% static 'assets/js/jquery.min.js' %}"></script>
<script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
